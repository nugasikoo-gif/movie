<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
    <!-- Dark Charcoal Background Rounded Tile -->
    <rect width="64" height="64" rx="14" fill="#171717" stroke="#3A3A3A" stroke-width="2" />
    
    <!-- Film Frame Body in Muted Gold -->
    <rect x="12" y="14" width="40" height="36" rx="6" fill="#D4A72C" />
    
    <!-- Left Sprocket Perforations -->
    <rect x="15" y="19" width="3.5" height="5" rx="1" fill="#171717" />
    <rect x="15" y="29.5" width="3.5" height="5" rx="1" fill="#171717" />
    <rect x="15" y="40" width="3.5" height="5" rx="1" fill="#171717" />
    
    <!-- Right Sprocket Perforations -->
    <rect x="45.5" y="19" width="3.5" height="5" rx="1" fill="#171717" />
    <rect x="45.5" y="29.5" width="3.5" height="5" rx="1" fill="#171717" />
    <rect x="45.5" y="40" width="3.5" height="5" rx="1" fill="#171717" />
    
    <!-- Central Cinema Screen Cutout -->
    <rect x="22" y="20" width="20" height="24" rx="3" fill="#171717" />
    
    <!-- Central Cinema Play Glyph in Gold Accent -->
    <polygon points="29,26.5 37,32 29,37.5" fill="#D4A72C" />
</svg>

